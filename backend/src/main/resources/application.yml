server:
  port: 8080

spring:
  application:
    name: task-workbench
  datasource:
    # H2 文件库：数据真实落盘到 backend/data/workbench.mv.db，重启不丢失
    url: jdbc:h2:file:./data/workbench;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

workbench:
  upload-dir: ./data/uploads

logging:
  level:
    com.twb: info
